<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SummerNest MVP Mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Two phone screens for the MVP slide: renter view and host view of the same Seattle room. */
:root {
  --page: #e9eae7;
  --page-fg: #1b1d1c;
  --ink: #161817;
  --soft: #6f7571;
  --rule: #e2e4e1;
  --screen: #ffffff;
  --panel: #f4f5f3;
  --accent: #2d6e9e;
  --tint: #e8f0f6;
  --ok: #3a7d5c;
  --ok-bg: #e5f1ea;
  --frame: #1c1e1d;
  --f-body: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #141615; --page-fg: #e6e8e6; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #141615; --page-fg: #e6e8e6; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-fg); font-family: var(--f-body); padding: 32px 16px 56px; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px; }
figure { margin: 0; display: grid; justify-items: center; gap: 14px; }
figcaption { font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }

.phone {
  width: 340px; height: 720px; border-radius: 48px; padding: 11px;
  background: var(--frame); box-shadow: 0 18px 40px rgba(0,0,0,.18);
}
.screen {
  position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden;
  background: var(--screen); color: var(--ink); display: flex; flex-direction: column;
}
.status { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: 600; }
.island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 96px; height: 26px; border-radius: 14px; background: var(--frame); }
.bars { display: flex; gap: 3px; align-items: flex-end; }
.bars i { display: block; width: 3px; background: var(--ink); border-radius: 1px; }

.top { flex: none; padding: 6px 18px 12px; border-bottom: 1px solid var(--rule); }
.search { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 12px; padding: 9px 12px; font-size: 14px; }
.search b { font-weight: 600; }
.search .sep { color: var(--soft); }
.back { color: var(--accent); font-size: 18px; line-height: 1; }
.h1 { font-size: 22px; font-weight: 700; margin: 2px 0 0; }

.body { flex: 1; padding: 12px 18px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.photo { position: relative; border-radius: 14px; overflow: hidden; height: 150px; flex: none; }
.photo svg { display: block; width: 100%; height: 100%; }
.count { position: absolute; right: 10px; bottom: 10px; background: rgba(22,24,23,.72); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 10px; }

.badge { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; background: var(--ok-bg); color: var(--ok); font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
.title { font-size: 19px; font-weight: 700; line-height: 1.2; margin: 0; }
.meta { display: flex; gap: 14px; font-size: 14px; color: var(--soft); margin-top: 3px; }
.meta b { color: var(--ink); font-weight: 700; }

.locked { border: 1px solid var(--rule); border-radius: 12px; }
.locked div { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 14px; color: var(--soft); }
.locked div + div { border-top: 1px solid var(--rule); }
.locked svg { flex: none; }

.host { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #d9c7b0; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #5c4a35; flex: none; }
.host b { display: block; font-size: 14px; }
.host span { color: var(--soft); }
.host .note { display: block; margin-top: 2px; color: var(--accent); font-weight: 600; }
.avatar.anon { background: var(--panel); color: var(--soft); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 5px; vertical-align: 1px; }

.cta { margin: auto 0 12px; display: block; width: 100%; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font: 700 16px var(--f-body); padding: 11px; text-align: center; }
.cta small { display: block; font-size: 12px; font-weight: 500; opacity: .85; margin-top: 2px; }

.label { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); margin: 0 0 6px; }
.card { border: 1px solid var(--rule); border-radius: 14px; padding: 12px; }
.listing { display: flex; gap: 12px; align-items: center; }
.thumb { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; flex: none; }
.thumb svg { display: block; width: 100%; height: 100%; }
.listing .title { font-size: 16px; }
.listing .meta { font-size: 13px; gap: 10px; }

.checks { display: grid; gap: 7px; font-size: 14px; }
.checks div { display: flex; align-items: center; gap: 8px; }
.tick { width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; flex: none; }
.shots { display: flex; gap: 5px; margin: 2px 0 2px 26px; }
.shots i { width: 30px; height: 30px; border-radius: 6px; display: block; }

.inbox { background: var(--tint); border: 0; }
.inbox .msg { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--accent); }
.inbox p { margin: 4px 0 10px 30px; font-size: 13px; color: var(--soft); }
.inbox .cta { margin: 0; padding: 11px; font-size: 15px; }

.also { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.also b { display: block; font-size: 15px; }
.also span { font-size: 13px; color: var(--soft); }
.also .go { color: var(--accent); font-size: 13px; font-weight: 700; white-space: nowrap; }

.tabs { flex: none; display: flex; justify-content: space-around; border-top: 1px solid var(--rule); padding: 9px 0 22px; font-size: 11px; color: var(--soft); }
.tabs div { display: grid; justify-items: center; gap: 3px; }
.tabs .on { color: var(--accent); font-weight: 700; }
.tabs i { width: 20px; height: 20px; border-radius: 6px; border: 2px solid currentColor; display: block; }
.tabs .on i { background: currentColor; }
.body.spread { justify-content: space-between; padding-bottom: 18px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Simple flat room illustration, reused as cover photo and thumbnail -->
    <symbol id="room" viewBox="0 0 320 172">
      <rect width="320" height="172" fill="#efe6d8"/>
      <rect y="128" width="320" height="44" fill="#c9ad8a"/>
      <rect x="196" y="22" width="92" height="74" rx="4" fill="#bcd6e6"/>
      <rect x="196" y="22" width="92" height="74" rx="4" fill="none" stroke="#fff" stroke-width="5"/>
      <line x1="242" y1="22" x2="242" y2="96" stroke="#fff" stroke-width="4"/>
      <rect x="22" y="92" width="150" height="46" rx="6" fill="#ffffff"/>
      <rect x="22" y="78" width="40" height="22" rx="6" fill="#dfe8ee"/>
      <rect x="22" y="112" width="150" height="26" rx="4" fill="#7a9cb3"/>
      <rect x="18" y="66" width="8" height="78" rx="3" fill="#8a6a4a"/>
      <rect x="214" y="108" width="74" height="8" rx="2" fill="#8a6a4a"/>
      <rect x="220" y="116" width="6" height="26" fill="#8a6a4a"/>
      <rect x="276" y="116" width="6" height="26" fill="#8a6a4a"/>
      <rect x="236" y="92" width="22" height="16" rx="2" fill="#4a4f4c"/>
      <circle cx="120" cy="40" r="16" fill="#f4d58d"/>
      <line x1="120" y1="0" x2="120" y2="24" stroke="#8a8f8c" stroke-width="2"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 16 16">
      <rect x="3" y="7" width="10" height="8" rx="2" fill="currentColor"/>
      <path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </symbol>
    <symbol id="check" viewBox="0 0 16 16">
      <path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="person" viewBox="0 0 16 16">
      <circle cx="8" cy="5.5" r="3" fill="currentColor"/>
      <path d="M2.5 14c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5z" fill="currentColor"/>
    </symbol>
    <symbol id="chat" viewBox="0 0 20 20">
      <path d="M3 4h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H8l-4 3v-3H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<div class="row">

  <!-- Renter view -->
  <figure>
    <div class="phone"><div class="screen">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span class="bars"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i></span></div>

      <div class="top">
        <div class="search"><span class="back">‹</span><b>Seattle</b><span class="sep">·</span><span>Jun 1 to Aug 31</span></div>
      </div>

      <div class="body">
        <div class="photo">
          <svg><use href="#room"/></svg>
          <span class="count">1 of 6</span>
        </div>

        <span class="badge"><svg width="14" height="14"><use href="#check"/></svg>Room verified 2 days ago</span>

        <div>
          <p class="title">Private room, U-District</p>
          <div class="meta"><span><b>$1,200</b> / mo</span><span>Jun 5 to Aug 30</span></div>
        </div>

        <div class="locked">
          <div><svg width="14" height="14"><use href="#lock"/></svg>5 more photos</div>
          <div><svg width="14" height="14"><use href="#lock"/></svg>Address and full details</div>
          <div><svg width="14" height="14"><use href="#lock"/></svg>Chat with host</div>
        </div>

        <div class="host">
          <span class="avatar anon"><svg width="16" height="16"><use href="#person"/></svg></span>
          <div><b>UW student · New host</b><span class="note">3 renters interested. We'll notify the host when you message.</span></div>
        </div>

        <div class="cta">Unlock for $29 / year<small>Full details, photos and chat for every room</small></div>
      </div>

      <div class="tabs">
        <div class="on"><i></i>Search</div>
        <div><i></i>Messages</div>
        <div><i></i>My room</div>
      </div>
    </div></div>
    <figcaption>Renter view</figcaption>
  </figure>

  <!-- Host view -->
  <figure>
    <div class="phone"><div class="screen">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span class="bars"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i></span></div>

      <div class="top">
        <p class="h1">My room</p>
      </div>

      <div class="body spread">
        <div class="card listing">
          <div class="thumb"><svg viewBox="0 0 320 172" preserveAspectRatio="xMidYMid slice"><use href="#room" width="320" height="172"/></svg></div>
          <div>
            <p class="title">Private room, U-District</p>
            <div class="meta"><span>Seattle</span><span>Jun 5 to Aug 30</span></div>
          </div>
        </div>

        <div>
          <p class="label">Verification</p>
          <div class="checks">
            <div><span class="tick"><svg width="11" height="11"><use href="#check"/></svg></span>ID photo taken in the room</div>
            <div><span class="tick"><svg width="11" height="11"><use href="#check"/></svg></span>5 room photos, different angles</div>
            <div class="shots"><i style="background:#efe6d8"></i><i style="background:#bcd6e6"></i><i style="background:#c9ad8a"></i><i style="background:#7a9cb3"></i><i style="background:#dfe8ee"></i></div>
            <div><span class="tick"><svg width="11" height="11"><use href="#check"/></svg></span><b>Room verified</b></div>
          </div>
        </div>

        <div class="card inbox">
          <div class="msg"><svg width="20" height="20"><use href="#chat"/></svg>You have 3 messages</div>
          <p>Renters want to ask about your room.</p>
          <div class="cta">Join to reply · $29 / year</div>
        </div>

        <div class="card also">
          <div><b>Also looking in SF Bay Area</b><span>Jun 8 to Aug 28</span></div>
          <span class="go">12 rooms ›</span>
        </div>
      </div>

      <div class="tabs">
        <div><i></i>Search</div>
        <div><i></i>Messages</div>
        <div class="on"><i></i>My room</div>
      </div>
    </div></div>
    <figcaption>Host view</figcaption>
  </figure>

</div>
</body>
</html>
